<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k0 — Backlog</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/backlog.css">
</head>
<body>
  <header class="topbar">
    <a class="home" href="/" title="Back to the dashboard">k0</a>
    <h1>Backlog</h1>

    <!-- Two lists and a search. The state is not here: it is six chips under the bar, because
         you switch several of them off at once and a multiple select is the one control nobody
         has ever worked out how to use. -->
    <select id="repo" class="pick" aria-label="Repository"></select>
    <select id="epic" class="pick" aria-label="Epic"></select>

    <div class="find">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" autocomplete="off" spellcheck="false" placeholder="search a title…">
    </div>

    <span class="count" id="count"></span>
  </header>

  <main class="sheet" id="sheet">
    <!-- The whole feature, switched off. One line and nothing else: a page of empty tables and
         dead filters would say the backlog is empty, which is not what has happened. -->
    <p class="off" id="off" hidden>The k0 backlog is switched off.</p>

    <div class="states" id="states" role="group" aria-label="State"></div>

    <table class="grid" id="grid">
      <thead id="head"></thead>
      <tbody id="rows"></tbody>
    </table>

    <p class="blank" id="blank" hidden></p>

    <!-- The open story. It arrives under the table rather than beside it: this page is read top
         to bottom, and a pane that scrolls on its own is two pages pretending to be one. -->
    <section class="story" id="story" hidden></section>

    <section class="epics" id="epics"></section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="/backlog.js"></script>
</body>
</html>
