<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k0 — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/board.css">
</head>
<body>
  <header class="topbar">
    <h1>k0</h1>
    <!-- The one mark on this bar that appears by itself, and only for one of two reasons: k0
         moved on under you while you were not looking, or npm says there is a newer version than
         the one installed here. It never opens the page — it sits next to the name and waits. -->
    <a class="whatsnew" id="whatsnew" href="/whatsnew.html" hidden>
      <span id="whatsnew-dot" aria-hidden="true"></span>
    </a>
    <!-- The "+" is a menu now, because there are two things it can make and they are made in
         two different ways: a story is typed here, an epic is told to Claude in a terminal. With
         the backlog off there is only one of them and the menu never opens — the plus is the
         plus it has always been. -->
    <div class="new-wrap">
      <button class="new" id="new-story" title="New story" aria-label="New story"
              aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="menu" id="new-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-new="story">Story<em>a post-it, written here</em></button>
        <button type="button" role="menuitem" data-new="epic">Epic<em>talked through in a terminal</em></button>
      </div>
    </div>
    <!-- Next to the plus, because they are the two ends of the same thing: one starts a piece
         of work, the other tells you how the ones before it went. A plain link, and a quiet
         one — no dot, no badge. It is there when you want it. -->
    <a class="log" href="/changelog.html" title="What you have been doing" aria-label="What you have been doing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h7"/></svg>
    </a>
    <!-- The state pills, the repository and the shape of the view: one group, because they are
         one question. The pills and the repository say WHAT you are looking at; Kanban or List
         says what shape it comes in. Switching shape never changes what is in scope. -->
    <div class="filterbar">
      <div class="filters" id="filters"></div>
      <!-- Two answers and no third: the board as it has always been, or the same stories as rows.
           It is only here when there is a backlog behind the board — with the feature off there is
           one answer, and a switch offering it would be a switch that does nothing. -->
      <div class="columns" id="columns" role="radiogroup" aria-label="How to look at it" hidden>
        <button type="button" role="radio" data-columns="kanban" aria-checked="true">Kanban</button>
        <button type="button" role="radio" data-columns="list" aria-checked="false">List</button>
      </div>
      <!-- Which repository, for both views. Empty means all of them. -->
      <select class="repo-filter" id="repo-filter" aria-label="Which repository" hidden></select>
    </div>

    <!-- How the computer is doing. Always visible; clicking it switches off the weights on the stories. -->
    <button class="gauge" id="gauge" type="button" hidden></button>

    <!-- The four modes: how awake the machine has to stay. It is a scale, not four switches —
         sleep, away, nerd, driving, each one including the one before it — and exactly one is
         always lit. Clicking the lit one again does nothing: to leave it you go to another. It
         sits at the end of the bar, where driving mode used to be. -->
    <div class="modes" id="modes" role="radiogroup" aria-label="Wake mode">
      <button type="button" role="radio" data-mode="sleep" aria-checked="false" title="Sleep" aria-label="Sleep">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5l-5 6h5"/><path d="M4 12h8l-8 8h8"/></svg>
      </button>
      <button type="button" role="radio" data-mode="away" aria-checked="false" title="Away" aria-label="Away">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.6 21.5c0-4.6.8-8.2 2.1-11.2"/><path d="M13.7 10.3c-2.5-1.7-5.4-1.5-7.5.4"/><path d="M13.7 10.3c-1.4-2.7-3.8-4.1-6.4-3.9"/><path d="M13.7 10.3c.4-3 2.3-5.2 4.9-5.8"/><path d="M13.7 10.3c2.6-1.2 5.4-.6 7.2 1.4"/></svg>
      </button>
      <button type="button" role="radio" data-mode="nerd" aria-checked="false" title="Nerd" aria-label="Nerd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="8.2" cy="10.4" r="2.8"/><circle cx="15.8" cy="10.4" r="2.8"/><path d="M11 10.4h2"/><path d="M8.6 16.4q3.4 2 6.8 0"/></svg>
      </button>
      <button type="button" role="radio" data-mode="driving" aria-checked="false" title="Driving" aria-label="Driving">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14"/><path d="M4 17v-4.2a2 2 0 0 1 .2-.9l1.9-3.8A2 2 0 0 1 7.9 7h8.2a2 2 0 0 1 1.8 1.1l1.9 3.8a2 2 0 0 1 .2.9V17"/><path d="M4 17v2h2v-2"/><path d="M18 17v2h2v-2"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/></svg>
      </button>
    </div>
  </header>

  <!-- Inside an epic. The board is that epic and nothing else, and this strip is the only thing
       that says so: which one, how far it has got, and the way back out. It is not on the page
       until you have gone in — an epic you are not in has nothing to say up here. -->
  <div class="lane" id="epic-lane" hidden>
    <span class="key" id="epic-key"></span>
    <span class="name" id="epic-name"></span>
    <span class="repo" id="epic-repo"></span>
    <span class="bar"><i id="epic-fill"></i></span>
    <span class="count" id="epic-count"></span>
    <span class="spacer"></span>
    <button type="button" id="epic-out">Leave the epic</button>
  </div>

  <main id="viewport" class="viewport">
    <div id="board" class="board"></div>
    <p class="empty" id="empty">The dashboard is empty. Add your first story.</p>

    <!-- Where the board continues past the edge: with no scrollbars, it is the only way to tell. -->
    <div class="edges" id="edges" aria-hidden="true"><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i></div>

    <div class="zoom" id="zoom">
      <button type="button" id="z-out" title="Zoom out, ten per cent at a time" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" id="z-level" title="Back to 100%">100%</button>
      <button type="button" id="z-in" title="Zoom in, ten per cent at a time" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" id="z-fit" title="Fit the whole board on screen" aria-label="Fit to screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </main>

  <dialog id="editor">
    <form id="editor-form">
      <div class="head">
        <h2 id="editor-title">New story</h2>
        <button type="button" id="f-close" class="x" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <label>Repository
        <div class="picker">
          <input id="f-project" autocomplete="off" placeholder="search a repository…">
          <div class="picker-list" id="f-project-list" hidden></div>
        </div>
      </label>

      <label>Title
        <input id="f-title" required autocomplete="off" spellcheck="false" placeholder="Fix-Login-Bug">
        <small>this is also the session name</small>
      </label>

      <label>What Claude should do when it starts
        <textarea id="f-prompt" rows="6" placeholder="you can leave this empty and type straight into Claude Code"></textarea>
      </label>

      <!-- The epic this story belongs to. A list of the ones this repository already has, or a
           name typed in that is made on the spot: an epic somebody wanted while writing a story
           should not cost a trip to another screen. Only here when there is a backlog. -->
      <label id="f-epic-row" hidden>Epic
        <input id="f-epic" list="f-epics" autocomplete="off" placeholder="none — or type a new one">
        <datalist id="f-epics"></datalist>
      </label>

      <!-- The flag. It used to sit on every note waiting to be clicked, which made it a mark that
           was everywhere and therefore marked nothing. It is a decision, so it is taken here,
           where the rest of the decisions about a story are taken. -->
      <label class="check" id="f-flag-row" hidden>
        <input type="checkbox" id="f-flag"> Flag it
        <small>it stands out on the board, and comes first when k0 is asked what to do next</small>
      </label>

      <footer>
        <button type="button" id="f-delete" class="danger">Delete</button>
        <span class="spacer"></span>
        <button type="submit" id="f-save">Save</button>
        <button type="button" id="f-start" class="primary">Start</button>
      </footer>
    </form>
  </dialog>

  <!-- A new epic. It asks for the repository and nothing else, then opens a terminal: an epic is
       born by being told, not by being typed into a form. -->
  <dialog id="epic-new">
    <form id="epic-form">
      <div class="head">
        <h2>New epic</h2>
        <button type="button" id="e-close" class="x" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <label>Repository
        <select id="e-project" required></select>
      </label>

      <p class="note">k0 opens a terminal and <code>/k0-epic</code> asks what this is, a round of
        questions at a time, until nothing is left that would change the work. It writes the epic
        down itself, and the stories under it, once it knows.</p>

      <footer>
        <span class="spacer"></span>
        <button type="button" id="e-cancel">Cancel</button>
        <button type="submit" class="primary">Start the discussion</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirm" class="ask">
    <p id="confirm-text"></p>
    <footer>
      <span class="spacer"></span>
      <button type="button" id="confirm-no">Cancel</button>
      <button type="button" id="confirm-yes" class="destructive">Delete</button>
    </footer>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="/board.js"></script>
</body>
</html>
