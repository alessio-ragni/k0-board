name: An idea
description: Something k0 could do that it does not do yet
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        k0 is deliberately small and has no dependencies, so the honest answer to a lot of good
        ideas is "not in k0". Saying what you were trying to do — rather than what you think k0
        should add — makes it much easier to tell which kind this is.

  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: The situation, not the solution. What did you have open, and what got in the way?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: If you already have an idea of the shape it should take, describe it here.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What do you do instead today?
      description: Even "I keep a second terminal open" is useful — it says how much this costs.
    validations:
      required: false
