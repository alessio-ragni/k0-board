name: Release

on:
  push:
    tags: ['v*']

# Publishing needs `id-token: write` twice over: it is how npm's trusted publishing recognises
# this workflow without a token, and it is what lets npm attach a provenance statement — proof,
# signed by GitHub, that this tarball was built from this commit of this repository. It costs one
# line and it is the difference between "trust me" and something a stranger can check.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tests run again here rather than being trusted from the pull request: a tag can be
      # pushed from anywhere, and a broken release is far more expensive than a minute of CI.
      - run: npm test

      - name: The tag has to match the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || {
            echo "tag $tag does not match package.json $version"
            exit 1
          }

      # A tag can be pushed again for perfectly ordinary reasons — a release note fixed, a tag
      # moved onto the right commit — and the registry refuses the same version twice. If this
      # version is already out there, there is nothing left to do and nothing to fail about.
      - name: Is this version already on the registry?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "k0-board@$version" version > /dev/null 2>&1; then
            echo "k0-board@$version is already published; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No token anywhere. npm is configured to trust this repository and this workflow, and the
      # `id-token: write` permission above is what lets the runner prove it is really them —
      # which is the same proof the provenance statement is built from. A token that can publish
      # is a token that can be stolen; this one does not exist between one release and the next.
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --access public --provenance
